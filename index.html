<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Busy Day — stay on top of your day" />
  <title>Busy Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="./src/style.css" / >
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:wght@400&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="18" height="18" rx="3" stroke="#1a1a1a" stroke-width="2"/>
        <path d="M5 10l3.5 3.5L15 7" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Busy Day
    </div>
  </header>

  <main class="main-content">
    <div class="container">

      <div class="page-intro">
        <div class="intro-left">
          <h1 class="greeting">Hello, Emily!</h1>
          <button class="add-list-btn" id="addListBtn">+ Add new List</button>
        </div>
        <div class="meta-block">
          <span id="currentDate"></span>
          <span id="weather"></span>
        </div>
      </div>

      <!-- ── Toolbar ── -->
      <div class="toolbar">
        <!-- Search -->
        <div class="search-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search tasks…" />
          <button class="search-clear" id="searchClear" aria-label="Clear search">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- Tabs -->
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="all" role="tab">All</button>
          <button class="tab" data-tab="active" role="tab">Active</button>
          <button class="tab" data-tab="completed" role="tab">Completed</button>
        </div>

        <!-- Sort (custom dropdown) -->
        <div class="sort-wrap" id="sortWrap">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="9" y1="18" x2="15" y2="18"/>
          </svg>
          <button class="sort-trigger" id="sortTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span id="sortLabel">Oldest</span>
            <svg class="sort-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <ul class="sort-menu" id="sortMenu" role="listbox" aria-label="Sort tasks">
            <li class="sort-option active" data-value="oldest" role="option">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
              Oldest
            </li>
            <li class="sort-option" data-value="newest" role="option">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
              Newest
            </li>
            <li class="sort-option" data-value="az" role="option">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
              A → Z
            </li>
            <li class="sort-option" data-value="za" role="option">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
              Z → A
            </li>
          </ul>
        </div>
      </div>

      <!-- ── Bulk Actions ── -->
      <div class="bulk-bar" id="bulkBar">
        <span class="bulk-count" id="bulkCount">0 selected</span>
        <div class="bulk-actions">
          <button class="bulk-btn" id="selectAllBtn">Select All</button>
          <button class="bulk-btn" id="unselectAllBtn">Unselect All</button>
          <button class="bulk-btn danger" id="deleteSelectedBtn">Delete Selected</button>
        </div>
      </div>

      <div class="lists-grid" id="listsGrid"></div>
      <p class="empty-state" id="emptyState" hidden>No tasks match your current filter.</p>

    </div>
  </main>

  <footer class="site-footer">
    <p>© 2024 Busy Day by ScriptedSprouts</p>
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
